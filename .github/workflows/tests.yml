name: tests

# 为什么必须在 Linux 上也跑:
# tests/test_bat_line_endings.py 读的是 git 对象库里的 blob,和平台无关。
# 所以即使 bug 只影响 Windows 用户,Linux runner 也能抓到
# “start.bat 被提交成 LF” —— 而它在编辑器、git diff 里完全看不出来。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    # 断言和 docstring 里全是中文。Windows runner 的控制台默认 cp1252,
    # unittest 每跑一条就要 print 一遍测试的首行 docstring,
    # 于是断言全过、进程倒在 print 上:
    #   UnicodeEncodeError: 'charmap' codec can't encode characters ...
    # 2026-10-23 的 run #1 就是这么红的(见 windows 那份日志的末尾)。
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: set up python
        run: uv python install 3.12

      # 这里原来还有一段 `shell: python` 的内联脚本,专门查 bat 的 CRLF。
      # 它和 tests/test_bat_line_endings.py 是同一份逻辑的两份实现,
      # 迟早会漂移;而且它踩了两个环境坑:
      #   * ubuntu runner 上没有 `python` 这个命令(只有 python3),脚本起不来;
      #   * Windows runner 上 print 中文直接 UnicodeEncodeError(cp1252)。
      # 现在只留测试那一份 —— 它断言的更细(blob / 工作区 / .gitattributes / BOM),
      # 失败信息也照样把 cmd.exe 的解析行为讲清楚。
      - name: unit tests
        run: uv run --with websockets python -m unittest discover -s tests -v
